<title>엘리맵 사용자 만족도 조사</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gaegu:wght@700&display=swap">
<style>
/* layout: single phone column — crisp hero art, survey items, big tap button, illustration, footer */
:root{--bg:#dcedfb;--card:#ffffff;--ink:#14205a;--sub:#4a5878;--blue:#1f4fd8;--green:#13924f;--green-dk:#0d7a41;--yellow:#ffd43b;--line:#cfe0ef;--orange:#f08a1c;
--font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--hand:"Gaegu","Noto Sans KR",cursive}
body{background:var(--bg);color:var(--ink);font-family:var(--font);word-break:keep-all}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 28px;display:grid;gap:16px}
.tag{margin:0;text-align:center;font-size:1rem;font-weight:700;color:var(--blue)}
.hero{display:block;width:100%;height:auto;border-radius:18px}
.lead{margin:0;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 16px;text-align:center;font-weight:700;font-size:.98rem;text-wrap:balance}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.item{background:var(--card);border-radius:16px;padding:12px 6px;text-align:center;display:grid;gap:4px;justify-items:center;box-shadow:0 2px 8px rgba(20,60,120,.08)}
.item img{width:48px;height:48px;border-radius:50%}
.item b{font-size:.95rem;color:var(--blue)}
.item span{font-size:.76rem;color:var(--sub);line-height:1.35}
.cta{background:var(--card);border-radius:22px;padding:20px 16px;display:grid;gap:14px;text-align:center;box-shadow:0 8px 24px rgba(20,60,120,.12)}
.cta h2{margin:0;font-size:1.1rem}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:68px;border-radius:999px;background:var(--green);color:#fff;text-decoration:none;font-size:1.45rem;font-weight:900;box-shadow:0 6px 0 var(--green-dk),0 10px 20px rgba(19,146,79,.3);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--green-dk)}
.btn:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.btn svg{width:26px;height:26px}
.meta{display:grid;gap:6px;margin:0;padding:0;list-style:none;color:var(--sub)}
.meta b{color:var(--ink)}
.url{font-size:.8rem;color:var(--sub);overflow-wrap:anywhere}
.illus{display:block;width:100%;height:auto;border-radius:18px}
.slogan{margin:0;text-align:center;font-family:var(--hand);font-size:1.5rem;color:var(--blue);line-height:1.3}
.slogan em{font-style:normal;color:var(--orange)}
.logo{display:block;width:78%;margin:0 auto;height:auto;border-radius:10px;background:#fff}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
<main class="wrap">
